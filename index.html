<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<title>Math Clicker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="updateBar" role="status" hidden>
  <span>New version available</span>
  <button id="updateBtn">Update</button>
</div>

<div id="app">
  <header class="top">
    <div>
      <div id="coins" class="coins"></div>
      <div id="rates" class="sub"></div>
    </div>
    <div class="streak">
      <span id="streak"></span>
      <div id="mult" class="sub"></div>
    </div>
  </header>

  <section id="v-play" class="view play">
    <div class="goal">
      <div class="goalrow">
        <span id="goalText"></span>
        <button id="buildBtn" hidden>Build!</button>
      </div>
      <div class="bar"><i id="goalBar"></i></div>
    </div>
    <div class="tap">
      <button id="rocket" class="rocket" aria-label="Tap the rocket">🚀</button>
      <small id="tapHint"></small>
      <div id="quizPanel" class="quiz" hidden>
        <div id="quizTitle"></div>
        <div id="quizTimer" class="timer"></div>
      </div>
    </div>
    <div class="math" id="mathCard">
      <div class="q">
        <span id="qText"></span>
        <span id="qEntry" class="entry"></span>
        <em id="qReward"></em>
      </div>
      <div class="pad" id="pad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="del" class="del" aria-label="Delete">⌫</button>
        <button data-k="0">0</button>
        <button data-k="ok" class="ok">OK</button>
      </div>
    </div>
  </section>

  <section id="v-upgrades" class="view scroll" hidden>
    <div id="upList"></div>
  </section>

  <section id="v-stats" class="view scroll" hidden>
    <h3>Daily challenge</h3>
    <button id="dailyBtn" class="wide"></button>
    <h3>Numbers</h3>
    <div id="summary" class="summary"></div>
    <h3>Times tables</h3>
    <div id="grid"></div>
    <p class="sub">Green = you know it · Yellow = almost · Red = practise · Grey = not tried</p>
    <h3>Achievements <span id="achCount"></span></h3>
    <div id="achList"></div>
    <h3>Settings</h3>
    <button id="soundBtn" class="wide plain"></button>
    <h3>About</h3>
    <p class="sub">Math Clicker · version <span id="ver">…</span></p>
    <button id="restartBtn" class="wide danger">Restart this flight</button>
  </section>

  <nav class="tabs" id="tabs">
    <button data-v="play" class="on">🚀 Play</button>
    <button data-v="upgrades">⬆️ Upgrades</button>
    <button data-v="stats">📊 Stats</button>
  </nav>
</div>

<div id="dialog" hidden>
  <div class="box" role="dialog" aria-modal="true">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText"></p>
    <div id="dlgBtns"></div>
  </div>
</div>
<div id="toast" role="status" hidden></div>

<script type="module" src="js/ui.js"></script>
</body>
</html>
